<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ページが見つかりません | OrangeMania</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#FAF8F4;color:#3a2a1a;font-family:'Nunito',-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;line-height:1.8}
.card{width:100%;max-width:440px;background:#fff;border:1px solid #E8E3DC;border-radius:14px;box-shadow:none;padding:36px 28px}
.label{display:block;margin:0 0 12px;font:500 11px/1.7 'DM Mono',ui-monospace,monospace;letter-spacing:.12em;color:#FF7F00}
h1{margin:0 0 8px;font-size:22px;font-weight:800;line-height:1.7}
p{margin:0 0 24px;font-size:14px;color:#7a6050}
a.btn{display:flex;align-items:center;justify-content:center;height:48px;border-radius:14px;background:#FF7F00;color:#fff;font-weight:800;font-size:15px;text-decoration:none}
a.btn:focus-visible{outline:3px solid #3a2a1a;outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <span class="label">404 NOT FOUND</span>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは、移動または削除された可能性があります。URLをご確認ください。</p>
  <a class="btn" href="/guide/web/">トップへ戻る</a>
</main>
</body>
</html>
